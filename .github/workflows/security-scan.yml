name: Scan sécurité hebdomadaire

on:
  schedule:
    - cron: "0 6 * * 6"   # samedi 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Recherche de secrets (historique complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # indispensable : sinon seul le dernier commit est scanné

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances-python:
    name: Audit des dépendances Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Installer pip-audit
        run: pip install pip-audit

      - name: Auditer
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc
          elif [ -f pyproject.toml ]; then
            pip-audit --desc
          else
            echo "Aucun manifeste Python trouvé, rien à auditer."
          fi

  dependances-node:
    name: Audit des dépendances Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Deux des quatre applications du VPS sont en Node (Next.js/vinext, Astro).
      # `npm audit` lit le lockfile : pas besoin d'installer les paquets.
      - name: Auditer
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high || echo "::warning::npm audit a remonté des vulnérabilités"
          else
            echo "Aucun package-lock.json, rien à auditer."
          fi
